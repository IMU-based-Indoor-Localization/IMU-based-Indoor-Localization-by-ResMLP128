plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── 릴리스 서명 키스토어 로드 ─────────────────────────────────────────────
// android/keystore.properties 에 실제 값을 기입하고 git에는 커밋하지 말 것.
// 파일이 없으면 debug 서명으로 폴백 (CI/CD 환경에서는 환경변수로 주입 권장).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.imulocal'
    compileSdk 34

    aaptOptions {
        noCompress "ptl", "pt"   // PyTorch 모델은 압축하지 않음 (LiteModuleLoader 직접 mmap)
    }

    defaultConfig {
        applicationId "com.imulocal"
        minSdk 26                   // Android 8.0+ (IMU API 안정)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ── NDK / CMake ────────────────────────────────────────
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
                arguments "-DANDROID_STL=c++_shared",
                          "-DEIGEN3_INCLUDE_DIR=${project.rootDir}/third_party/eigen"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"   // 실기기(arm64) + 에뮬레이터(x86_64)
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias     keystoreProperties['keyAlias']
                keyPassword  keystoreProperties['keyPassword']
                storeFile    file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 코드 축소 + 난독화 활성화 (Play Store AAB 권장)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // keystore.properties 가 있을 때만 릴리스 서명 적용
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 개발 시 빠른 빌드
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // PyTorch Mobile Lite (추론 엔진)
    implementation 'org.pytorch:pytorch_android_lite:2.1.0'

    // 코루틴
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // 테스트
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
